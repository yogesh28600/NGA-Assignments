<div class="container mt-3">
  <h2>Students List</h2>
  <table class="table table-dark table-hover mt-2">
    <thead>
      <tr>
        <th>Id</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Location</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of Students">
        <td>{{ student.id }}</td>
        <td>{{ student.firstname }}</td>
        <td>{{ student.lastname }}</td>
        <td>{{ student.location }}</td>
      </tr>
    </tbody>
  </table>
</div>
